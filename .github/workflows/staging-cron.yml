name: Run Test Crons

# Vercel ignores cron definitions on Preview deployments. Invoke the stable
# staging URL from Actions so the same jobs run against Neon once per day.
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-cron
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install Vercel CLI
        timeout-minutes: 10
        run: npm install --global vercel@58.1.0 --no-audit --no-fund

      - name: Link Vercel project
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Run staging cron routes
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node scripts/run-staging-crons.mjs
