name: Preview

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    # Secrets aren't exposed to Dependabot PRs or PRs from forks, so
    # `vercel --token=` would be empty and the job would always fail. Skip it
    # there; `check` still gates those PRs.
    if: >-
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # Reuses the existing VERCEL_TOKEN. `vercel pull` auto-detects the linked
      # project from the git remote, exactly like deploy.yml. CLI --prebuilt
      # deploys bypass the project's Ignored Build Step.
      - name: Pull Vercel preview env
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy preview
        id: deploy
        run: echo "url=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL on the PR
        uses: actions/github-script@v9
        with:
          script: |
            const url = "${{ steps.deploy.outputs.url }}";
            const marker = "<!-- preview-url -->";
            const body = `${marker}\n🔍 **Preview:** ${url}\n\n_Shares the production database — treat it as live data._`;
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number,
            });
            const prev = comments.find((c) => c.body.includes(marker));
            if (prev) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: prev.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }
