name: Preview

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    # Secrets aren't exposed to Dependabot PRs or PRs from forks, so
    # `vercel --token=` would be empty and the job would always fail. Skip it
    # there; `check` still gates those PRs.
    if: >-
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      # A preview of a branch that adds a column is useless if the database
      # does not have it. Staging is shared, so this applies the PR's
      # migrations there; reset-staging.yml is the cleanup valve for
      # migrations from PRs that never merge.
      #
      # DIRECT_URL must be the Supabase SESSION pooler (port 5432 on
      # pooler.supabase.com). db.<ref>.supabase.co is IPv6-only and GitHub
      # runners have no IPv6, so it fails with P1001.
      - name: Migrate staging
        id: migrate
        env:
          DIRECT_URL: ${{ secrets.STAGING_DIRECT_URL }}
        run: |
          if [ -z "$DIRECT_URL" ]; then
            echo "staging=false" >> "$GITHUB_OUTPUT"
            echo "::warning::STAGING_DIRECT_URL is not set, so this preview still runs against whatever the Preview env scope points at, which today is PRODUCTION. Run 'npm run setup:staging'."
            exit 0
          fi
          echo "staging=true" >> "$GITHUB_OUTPUT"
          npx prisma migrate deploy

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # Reuses the existing VERCEL_TOKEN. `vercel pull` auto-detects the linked
      # project from the git remote, exactly like deploy.yml. CLI --prebuilt
      # deploys bypass the project's Ignored Build Step. The preview env scope
      # carries the staging database and staging credentials.
      - name: Pull Vercel preview env
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy preview
        id: deploy
        run: echo "url=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL on the PR
        uses: actions/github-script@v7
        with:
          script: |
            const url = "${{ steps.deploy.outputs.url }}";
            const marker = "<!-- preview-url -->";
            // Tell the truth about which database this is on: before
            // `npm run setup:staging` has been run there is no staging DB, and
            // the Preview env scope still resolves to production.
            const onStaging = "${{ steps.migrate.outputs.staging }}" === "true";
            const body = [
              marker,
              `🔍 **Preview:** ${url}`,
              "",
              onStaging
                ? "Runs against the **staging** database, not production. Break whatever you like."
                : "⚠️ **Still on the production database.** `npm run setup:staging` has not been run yet, so treat this as live data.",
              "Email and Razorpay are live here, so links in any mail this sends point back at this preview.",
              onStaging ? "Messy state? Run the **Reset staging** workflow." : "",
            ].filter(Boolean).join("\n");
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number,
            });
            const prev = comments.find((c) => c.body.includes(marker));
            if (prev) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: prev.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }
