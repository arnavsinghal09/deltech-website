name: Deploy

on:
  push:
    branches:
      - main

# Merges used to race: two quick merges started two production deploys and two
# migration runs against the same database. Queue them instead, and never
# cancel a run that may be mid-migration.
concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  # Gate. Both deploys depend on this, so a red build ships nothing.
  ci:
    uses: ./.github/workflows/check.yml
    secrets: inherit

  # Staging first. If a migration is going to fail, it fails here, against the
  # scratch database, before production is touched.
  staging:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      # Skips rather than fails while the staging database does not exist yet,
      # so merging this pipeline cannot freeze production deploys. Once
      # `npm run setup:staging` has run, the secret exists and this becomes a
      # real gate.
      #
      # DIRECT_URL must be the Supabase SESSION pooler (port 5432 on
      # pooler.supabase.com), NOT db.<ref>.supabase.co. That host is IPv6-only
      # and GitHub runners have no IPv6, so it fails with P1001. Port 6543 is
      # the transaction pooler and cannot run DDL.
      - name: Migrate staging
        env:
          DIRECT_URL: ${{ secrets.STAGING_DIRECT_URL }}
        run: |
          if [ -z "$DIRECT_URL" ]; then
            echo "::warning::STAGING_DIRECT_URL is not set, so the staging migration was skipped. Run 'npm run setup:staging' (see docs/CI.md)."
            exit 0
          fi
          npx prisma migrate deploy

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # Preview scope = the staging database and staging credentials.
      - name: Pull Vercel preview env
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy staging
        id: deploy
        run: echo "url=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})" >> "$GITHUB_OUTPUT"

      # Gives main's staging build a stable address instead of a new hash each
      # time. Vercel's branch-domain feature cannot do this for us because the
      # project's Ignored Build Step cancels git-triggered builds.
      #
      # Non-fatal. The domain does not exist until `npm run setup:staging` has
      # run, and a missing alias is cosmetic: the deployment above already
      # succeeded and is reachable at its own URL. Letting this fail the job
      # took `production` down with it, since production needs staging.
      - name: Alias to test.deltechmun.in
        run: |
          if ! vercel alias set "${{ steps.deploy.outputs.url }}" test.deltechmun.in --token=${{ secrets.VERCEL_TOKEN }}; then
            echo "::warning::Could not alias test.deltechmun.in (the domain is probably not on the project yet). Staging is live at ${{ steps.deploy.outputs.url }}. Run 'npm run setup:staging'."
          fi

  production:
    needs: [ci, staging]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      # Nothing applied migrations before this. Merging a schema change shipped
      # code against a database missing those columns, silently, until someone
      # remembered to run the CLI by hand. Warns rather than fails while the
      # secret is missing, so this pipeline landing cannot stop deployments;
      # that leaves the pre-existing manual step in place until setup runs.
      - name: Migrate production
        env:
          DIRECT_URL: ${{ secrets.PROD_DIRECT_URL }}
        run: |
          if [ -z "$DIRECT_URL" ]; then
            echo "::warning::PROD_DIRECT_URL is not set, so production was NOT migrated. Set it to the SESSION pooler URL (port 5432 on pooler.supabase.com); db.<ref>.supabase.co is IPv6-only and unreachable from runners."
            exit 0
          fi
          npx prisma migrate deploy

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel production env
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
