name: Deploy

on:
  push:
    branches:
      - main

# Merges used to race: two quick merges started two production deploys and two
# migration runs against the same database. Queue them instead, and never
# cancel a run that may be mid-migration.
concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  # Gate. Both deploys depend on this, so a red build ships nothing.
  ci:
    uses: ./.github/workflows/check.yml
    secrets: inherit

  # Staging first. If a migration is going to fail, it fails here, against the
  # scratch database, before production is touched.
  staging:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      # Neon unpooled URL. Missing staging credentials are fatal: Production
      # must not deploy when its staging gate did not actually run.
      - name: Migrate staging
        env:
          DIRECT_URL: ${{ secrets.STAGING_DIRECT_URL }}
        run: |
          if [ -z "$DIRECT_URL" ]; then
            echo "::error::STAGING_DIRECT_URL is not set. Run 'Set up staging (Vercel side)'."
            exit 1
          fi
          npx prisma migrate deploy

      - name: Sync production integration configuration
        run: npm run sync:staging:integrations
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # Preview scope = the staging database and staging credentials.
      - name: Pull Vercel preview env
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      # Capture the URL separately: command substitution inside echo would hide
      # a failed deploy and let the job go green with an empty URL.
      - name: Deploy staging
        id: deploy
        run: |
          set -o pipefail
          URL=$(vercel deploy --prebuilt --archive=tgz --token=${{ secrets.VERCEL_TOKEN }})
          if [ -z "$URL" ]; then
            echo "::error::vercel deploy produced no URL."
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      # Gives main's staging build a stable address instead of a new hash each
      # time. Vercel's branch-domain feature cannot do this for us because the
      # project's Ignored Build Step cancels git-triggered builds.
      #
      - name: Alias to test.deltechmun.in
        run: vercel alias set "${{ steps.deploy.outputs.url }}" test.deltechmun.in --token=${{ secrets.VERCEL_TOKEN }}

      # The homepage and availability board both read application settings from
      # Neon, so these checks verify more than static asset delivery.
      - name: Smoke-test staging
        run: |
          for path in / /availability /signin; do
            curl --fail --silent --show-error --location \
              --retry 5 --retry-delay 5 --retry-all-errors \
              "https://test.deltechmun.in${path}" > /dev/null
          done
          STATUS=$(curl --silent --output /dev/null --write-out "%{http_code}" \
            "https://test.deltechmun.in/api/cron/gform-sync")
          if [ "$STATUS" != "401" ]; then
            echo "::error::Uncredentialed staging cron returned HTTP $STATUS instead of 401."
            exit 1
          fi

  production:
    needs: [ci, staging]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      # Supabase session pooler (port 5432). Missing migration credentials are
      # fatal: shipping code against an old schema is not a valid deployment.
      - name: Migrate production
        env:
          DIRECT_URL: ${{ secrets.PROD_DIRECT_URL }}
        run: |
          if [ -z "$DIRECT_URL" ]; then
            echo "::error::PROD_DIRECT_URL is not set. Use the SESSION pooler URL (port 5432 on pooler.supabase.com)."
            exit 1
          fi
          npx prisma migrate deploy

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel production env
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy production
        run: vercel deploy --prebuilt --prod --archive=tgz --token=${{ secrets.VERCEL_TOKEN }}
