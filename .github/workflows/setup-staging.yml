name: Set up staging (Vercel side)

# Manual, one-off, idempotent.
#
# The Vercel half of `npm run setup:staging` has to run here rather than on a
# laptop: the production Vercel project lives on a different account from most
# contributors', so a local `vercel login` cannot see it and the API returns
# 404. The token that can is the VERCEL_TOKEN repo secret, and secrets are only
# readable from inside Actions.
#
# The GitHub half (setting STAGING_* / PROD_* secrets, branch protection) is
# skipped here, because GITHUB_TOKEN cannot write Actions secrets. Those are set
# from a maintainer's machine with `gh`.
on:
  workflow_dispatch:
    inputs:
      deploy_staging:
        description: Deploy and smoke-test test.deltechmun.in after setup
        required: false
        default: false
        type: boolean

concurrency:
  group: setup-staging
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Vercel CLI
        timeout-minutes: 10
        run: npm install --global vercel@58.1.0 --no-audit --no-fund

      # Writes .vercel/project.json, which tells the scripts which project and
      # team to configure. Auto-detects from the git remote, as deploy.yml does.
      - name: Link Vercel project
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      # Restores Production-scoped vars if an earlier run narrowed rows that
      # were shared between Production and Preview down to preview-only. No-op
      # once they are correct, and it prints the resulting scoping either way.
      - name: Repair production env
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          PROD_DIRECT_URL: ${{ secrets.PROD_DIRECT_URL }}
          PROD_AUTH_SECRET: ${{ secrets.PROD_AUTH_SECRET }}
          PROD_EMAIL_FROM: ${{ secrets.PROD_EMAIL_FROM }}
          PROD_ADMIN_EMAIL: ${{ secrets.PROD_ADMIN_EMAIL }}
          PROD_AUTH_RESEND_KEY: ${{ secrets.PROD_AUTH_RESEND_KEY }}
          PROD_RAZORPAY_KEY_ID: ${{ secrets.PROD_RAZORPAY_KEY_ID }}
          PROD_RAZORPAY_KEY_SECRET: ${{ secrets.PROD_RAZORPAY_KEY_SECRET }}
          PROD_RAZORPAY_WEBHOOK_SECRET: ${{ secrets.PROD_RAZORPAY_WEBHOOK_SECRET }}
          PROD_GFORM_SHARED_SECRET: ${{ secrets.PROD_GFORM_SHARED_SECRET }}
          PROD_CRON_SECRET: ${{ secrets.PROD_CRON_SECRET }}
          PROD_SHEET_SYNC_SECRET: ${{ secrets.PROD_SHEET_SYNC_SECRET }}
          PROD_NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.PROD_NEXT_PUBLIC_SUPABASE_URL }}
          PROD_NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.PROD_NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          PROD_GROQ_API_KEY: ${{ secrets.PROD_GROQ_API_KEY }}
          PROD_GROQ_MODEL: ${{ secrets.PROD_GROQ_MODEL }}
        run: node scripts/repair-prod-env.mjs

      - name: Configure staging
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          STAGING_DIRECT_URL: ${{ secrets.STAGING_DIRECT_URL }}
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          PROD_DIRECT_URL: ${{ secrets.PROD_DIRECT_URL }}
          PROD_ADMIN_EMAIL: ${{ secrets.PROD_ADMIN_EMAIL }}
          PROD_AUTH_RESEND_KEY: ${{ secrets.PROD_AUTH_RESEND_KEY }}
          PROD_RAZORPAY_KEY_ID: ${{ secrets.PROD_RAZORPAY_KEY_ID }}
          PROD_RAZORPAY_KEY_SECRET: ${{ secrets.PROD_RAZORPAY_KEY_SECRET }}
          PROD_RAZORPAY_WEBHOOK_SECRET: ${{ secrets.PROD_RAZORPAY_WEBHOOK_SECRET }}
          PROD_GFORM_SHARED_SECRET: ${{ secrets.PROD_GFORM_SHARED_SECRET }}
          PROD_CRON_SECRET: ${{ secrets.PROD_CRON_SECRET }}
          PROD_SHEET_SYNC_SECRET: ${{ secrets.PROD_SHEET_SYNC_SECRET }}
          PROD_NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.PROD_NEXT_PUBLIC_SUPABASE_URL }}
          PROD_NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.PROD_NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          PROD_GROQ_API_KEY: ${{ secrets.PROD_GROQ_API_KEY }}
          PROD_GROQ_MODEL: ${{ secrets.PROD_GROQ_MODEL }}
          SKIP_GH_SECRETS: "1"
        run: npm run setup:staging

      # This is the pre-merge recovery path. The Deploy workflow cannot be
      # dispatched manually until its workflow_dispatch trigger reaches main,
      # while this long-standing setup workflow can run from the PR branch.
      - name: Require shared integrations before deployment
        if: inputs.deploy_staging
        env:
          PROD_ADMIN_EMAIL: ${{ secrets.PROD_ADMIN_EMAIL }}
          PROD_AUTH_RESEND_KEY: ${{ secrets.PROD_AUTH_RESEND_KEY }}
          PROD_RAZORPAY_KEY_ID: ${{ secrets.PROD_RAZORPAY_KEY_ID }}
          PROD_RAZORPAY_KEY_SECRET: ${{ secrets.PROD_RAZORPAY_KEY_SECRET }}
          PROD_RAZORPAY_WEBHOOK_SECRET: ${{ secrets.PROD_RAZORPAY_WEBHOOK_SECRET }}
          PROD_GFORM_SHARED_SECRET: ${{ secrets.PROD_GFORM_SHARED_SECRET }}
          PROD_CRON_SECRET: ${{ secrets.PROD_CRON_SECRET }}
          PROD_SHEET_SYNC_SECRET: ${{ secrets.PROD_SHEET_SYNC_SECRET }}
          PROD_NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.PROD_NEXT_PUBLIC_SUPABASE_URL }}
          PROD_NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.PROD_NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          PROD_GROQ_API_KEY: ${{ secrets.PROD_GROQ_API_KEY }}
        run: |
          missing=0
          for key in \
            PROD_ADMIN_EMAIL \
            PROD_AUTH_RESEND_KEY \
            PROD_RAZORPAY_KEY_ID \
            PROD_RAZORPAY_KEY_SECRET \
            PROD_RAZORPAY_WEBHOOK_SECRET \
            PROD_GFORM_SHARED_SECRET \
            PROD_CRON_SECRET \
            PROD_SHEET_SYNC_SECRET \
            PROD_NEXT_PUBLIC_SUPABASE_URL \
            PROD_NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY \
            PROD_GROQ_API_KEY
          do
            if [ -z "${!key}" ]; then
              echo "::error::$key is not set."
              missing=1
            fi
          done
          exit "$missing"

      - name: Migrate staging
        if: inputs.deploy_staging
        env:
          DIRECT_URL: ${{ secrets.STAGING_DIRECT_URL }}
        run: npx prisma migrate deploy

      - name: Sync production integration configuration
        if: inputs.deploy_staging
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: npm run sync:staging:integrations

      - name: Refresh Vercel preview env
        if: inputs.deploy_staging
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build staging
        if: inputs.deploy_staging
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy staging
        if: inputs.deploy_staging
        id: deploy
        run: |
          set -o pipefail
          URL=$(vercel deploy --prebuilt --archive=tgz --token=${{ secrets.VERCEL_TOKEN }})
          if [ -z "$URL" ]; then
            echo "::error::vercel deploy produced no URL."
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Alias to test.deltechmun.in
        if: inputs.deploy_staging
        run: vercel alias set "${{ steps.deploy.outputs.url }}" test.deltechmun.in --token=${{ secrets.VERCEL_TOKEN }}

      - name: Smoke-test staging
        if: inputs.deploy_staging
        run: |
          for path in / /availability /signin; do
            curl --fail --silent --show-error --location \
              --retry 5 --retry-delay 5 --retry-all-errors \
              "https://test.deltechmun.in${path}" > /dev/null
          done
          STATUS=$(curl --silent --output /dev/null --write-out "%{http_code}" \
            "https://test.deltechmun.in/api/cron/gform-sync")
          if [ "$STATUS" != "401" ]; then
            echo "::error::Uncredentialed staging cron returned HTTP $STATUS instead of 401."
            exit 1
          fi

      - name: Next steps
        run: |
          {
            echo "### Staging configured"
            echo ""
            if [ "${{ inputs.deploy_staging }}" = "true" ]; then
              echo "Staging was deployed and smoke-tested at <https://test.deltechmun.in>."
            else
              echo "Run **Reset staging**, then rerun this workflow with **deploy_staging** to deploy and verify <https://test.deltechmun.in>."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
