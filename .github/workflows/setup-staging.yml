name: Set up staging (Vercel side)

# Manual, one-off, idempotent.
#
# The Vercel half of `npm run setup:staging` has to run here rather than on a
# laptop: the production Vercel project lives on a different account from most
# contributors', so a local `vercel login` cannot see it and the API returns
# 404. The token that can is the VERCEL_TOKEN repo secret, and secrets are only
# readable from inside Actions.
#
# The GitHub half (setting STAGING_* / PROD_DIRECT_URL, branch protection) is
# skipped here, because GITHUB_TOKEN cannot write Actions secrets. Those are
# set from a maintainer's machine with `gh`.
on:
  workflow_dispatch:

concurrency:
  group: setup-staging
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # Writes .vercel/project.json, which tells the script which project and
      # team to configure. Auto-detects from the git remote, as deploy.yml does.
      - name: Link Vercel project
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Report env scoping (no values)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          node -e '
            const fs=require("fs");
            const {projectId,orgId}=JSON.parse(fs.readFileSync(".vercel/project.json","utf8"));
            fetch(`https://api.vercel.com/v9/projects/${projectId}/env?teamId=${orgId}`,{headers:{Authorization:`Bearer ${process.env.VERCEL_TOKEN}`}})
              .then(r=>r.json()).then(d=>{
                console.log("KEY".padEnd(40)+"TARGETS");
                for(const e of d.envs.sort((a,b)=>a.key.localeCompare(b.key)))
                  console.log(e.key.padEnd(40)+JSON.stringify(e.target));
              }).catch(e=>{console.error(e);process.exit(1)});
          '

      - name: Configure staging
        if: ${{ false }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          STAGING_DIRECT_URL: ${{ secrets.STAGING_DIRECT_URL }}
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          SKIP_GH_SECRETS: "1"
        run: npm run setup:staging

      - name: Next steps
        run: |
          {
            echo "### Staging configured"
            echo ""
            echo "Now run **Reset staging** to migrate and seed, then check <https://test.deltechmun.in>."
          } >> "$GITHUB_STEP_SUMMARY"
