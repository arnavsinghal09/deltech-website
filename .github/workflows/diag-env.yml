name: Diagnose Vercel env

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Link
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
      - name: List env keys and targets (NO values)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          node -e '
            const fs=require("fs");
            const {projectId,orgId}=JSON.parse(fs.readFileSync(".vercel/project.json","utf8"));
            fetch(`https://api.vercel.com/v9/projects/${projectId}/env?teamId=${orgId}`,{headers:{Authorization:`Bearer ${process.env.VERCEL_TOKEN}`}})
              .then(r=>r.json()).then(d=>{
                for(const e of d.envs.sort((a,b)=>a.key.localeCompare(b.key))){
                  console.log(`${e.key.padEnd(38)} ${JSON.stringify(e.target)}`);
                }
              });
          '
