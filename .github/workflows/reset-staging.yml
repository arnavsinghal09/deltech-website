name: Reset staging

# Manual only. Wipes the staging database and rebuilds it from
# prisma/seed-staging.ts.
#
# This is the pressure valve for the staging database: test data piles up over
# time, so this rebuilds a clean copy of the current main-branch schema.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "reset staging" to confirm. This deletes all staging data.'
        required: true
        type: string

concurrency:
  group: reset-staging
  cancel-in-progress: false

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - name: Check confirmation
        if: inputs.confirm != 'reset staging'
        run: |
          echo "::error::Confirmation text did not match. Type exactly: reset staging"
          exit 1

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      # Drops and recreates the schema, then replays every migration. Points at
      # STAGING_DIRECT_URL only; the seed itself refuses to run against the
      # production project ref as a second line of defence.
      - name: Reset schema
        run: npx prisma migrate reset --force
        env:
          DIRECT_URL: ${{ secrets.STAGING_DIRECT_URL }}

      - name: Seed staging
        run: npx tsx prisma/seed-staging.ts
        env:
          ALLOW_DESTRUCTIVE_SEED: "1"
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.STAGING_DIRECT_URL }}

      # Copies only integration configuration: Google Form source URLs,
      # column mappings, and the public-sheet mirror URL. Delegates, payments,
      # users, and every other production record remain in Production.
      - name: Sync production integration configuration
        run: npm run sync:staging:integrations
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}

      - name: Summary
        run: echo "Staging reset and reseeded. https://test.deltechmun.in" >> "$GITHUB_STEP_SUMMARY"
